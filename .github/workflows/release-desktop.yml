name: Release Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Public Release asset used at build time (not fetched by the browser).
  MODEL_DOWNLOAD_URL: https://github.com/mosynthkey/ScreenDesc/releases/download/model/screenparser.onnx

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Download ScreenParser model
        run: npm run fetch-model

      - name: Download PaddleOCR models
        run: npm run fetch-ocr-model

      # electron-builder imports the certificate, codesigns with hardened
      # runtime + entitlements, notarizes, and staples in one step (see
      # package.json "build".mac). CSC_LINK accepts the same base64 p12
      # content used by the old manual `security import` flow.
      - name: Build, sign & notarize desktop app
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run desktop:package -- --mac

      - name: Verify notarization
        # electron-builder's unpacked-app dir name depends on the runner's arch
        # (mac/ vs mac-arm64/), so locate the bundle instead of hardcoding it.
        # `spctl --assess` alone would pass for a notarized-but-unstapled app via
        # the online check, so also validate the staple explicitly (offline-safe).
        run: |
          set -euo pipefail
          APP_PATH=$(find dist-desktop -maxdepth 2 -name "ScreenDesc.app" -print -quit)
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenDesc-macos-notarized
          path: |
            dist-desktop/ScreenDesc-macos.zip
            dist-desktop/*.dmg

      - name: Attach to GitHub Release
        # The dmg is the drag-to-Applications installer users download; the
        # zip is the electron-updater (Squirrel.Mac) update payload — not a
        # user-facing download, but latest-mac.yml points at it, so both ship.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" dist-desktop/ScreenDesc-macos.zip dist-desktop/*.dmg dist-desktop/latest-mac.yml --repo "${{ github.repository }}" --clobber

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Download ScreenParser model
        run: npm run fetch-model

      - name: Download PaddleOCR models
        run: npm run fetch-ocr-model

      - name: Build desktop app (unsigned)
        run: npm run desktop:package -- --win

      - name: List build output
        shell: pwsh
        run: Get-ChildItem -Recurse dist-desktop

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenDesc-windows-unsigned
          path: dist-desktop/ScreenDesc-Setup.exe

      - name: Attach to GitHub Release
        # latest.yml is the electron-updater manifest the app polls to detect
        # updates — it must ship alongside the NSIS installer it points at.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" dist-desktop/ScreenDesc-Setup.exe dist-desktop/latest.yml --repo "${{ github.repository }}" --clobber
